[package]
name = "blazingly-json"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A focused, Tokio-free JSON engine for small protocol and API payloads"
repository = "https://github.com/sergii-ziborov/blazingly-json"
readme = "README.md"
keywords = ["json", "serde", "mcp", "json-rpc", "performance"]
categories = ["encoding", "parser-implementations", "web-programming"]
publish = false

[dependencies]
itoa = "1.0.18"
memchr = "2.8.3"
ryu = "1.0.23"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
proptest = "1.11.0"
serde_json = "1.0.151"

[[bench]]
name = "serde_json_comparison"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
